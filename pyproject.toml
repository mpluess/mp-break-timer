[project]
name = "mp-break-timer"
version = "0.1.0"
description = "Break timer for Windows with hold-to-snooze, meeting disable and a daily work time limit"
readme = "README.md"
authors = [
    { name = "Michel Pluess", email = "michel.pluess@ateleris.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.11.2",
]

[project.gui-scripts]
mp-break-timer = "mp_break_timer.app:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
